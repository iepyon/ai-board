# ai-board の設定。git に載せる。fork したら github.repository を自分のものに書き換える。

# レビュー要求（PR）の取得先。owner/repo の形式で書く。
# 書かなければ連携は無効になり、PR 中 / マージ済みの列がレビュー要求由来の情報を持たないだけでボードは動く。
# アクセストークンは要らない。認証はログイン済みの gh CLI に委ねる（gh auth login）。
github:
  repository: 'iepyon/ai-board'

# カードの置き場所。git のリモートの 1 つのブランチの .ai-board/ に、カード・判断・並び順のファイルを置く。
# 書かなければ origin の main。CLI は fetch して読み、書き込みはコミットとして push する。
# 始め方は ai-board store init → ai-board store seed。
store:
  remote: origin
  branch: main
