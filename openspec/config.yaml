schema: spec-driven

context: |
  Language: ja
  All artifacts must be written in ja.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ai-board は OpenSpec 駆動開発のためのローカル Web カンバン。
  openspec/ ディレクトリと GitLab を読んでカードのステージを自動導出し、
  実態から導出できない部分（アイデア・探索・実装中）だけをカードファイルに保存する。
  ステージ: アイデア → 探索済み → 提案済み → 実装中 → AI-PR → AI-PR 修正済み → 完了

  スタック: TypeScript (ESM, Node >= 20) / Express 5 + React 19 + Vite / Vitest / ESLint + Prettier
  レイアウト: src/ に実装、dist/ にビルド成果物、カード実体は .ai-board/
  検証コマンド: npm run typecheck && npm run lint && npm test

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
