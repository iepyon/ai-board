name: CI

# 一旦、PR と main への push では走らせない（GitHub の支払い・使用上限の問題でジョブが起動しないため。人の依頼）。
# 戻すときは push（main）と pull_request のトリガーを足し直す。手で走らせるなら Actions の画面から workflow_dispatch で起動する
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 一旦、手元で使う版（26）だけで通す。engines（>= 24）の下限の 24 と windows のジョブは、Actions の使用量を抑えるため外している
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # カバレッジ閾値（vitest.config.ts）もここで強制する
      - run: npm run test:coverage
      - run: npm run build
