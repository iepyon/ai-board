name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # package.json の engines（>= 24）の下限と、手元で使う版の両方で通す
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # カバレッジ閾値（vitest.config.ts）もここで強制する
      - run: npm run test:coverage
      - run: npm run build
