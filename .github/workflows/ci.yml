name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # engines の下限（>= 22.13）から LTS の 24・26 まで通す。node:sqlite を使うため 22 未満では動かない
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # カバレッジ閾値（vitest.config.ts）もここで強制する
      - run: npm run test:coverage
      - run: npm run build
